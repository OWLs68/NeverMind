name: E2E (Playwright)

# Замінює Hetzner-тестер (v1d9eo): безкоштовний раннер у CI. Збирає застосунок
# (esbuild → bundle.js), піднімає статику, ганяє Playwright. Прогон видно в Actions.

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'index.html'
      - 'style.css'
      - 'sw.js'
      - 'src/**'
      - 'build.js'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'   # щодня о 06:00 UTC

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      # Контракт-тести (детерміновані: guards/parser/factories/entity/escape).
      # Швидкі, без браузера — падають ДО важкого install browsers. Той самий
      # набір що ганяє pre-push (UNIT_GUARD_SCRIPTS), тепер і як CI-гейт (gfrvu5).
      - name: Contract tests (node)
        run: |
          node scripts/check-guards.js
          node scripts/check-intent-router.js
          node scripts/check-factories.js
          node scripts/check-entity.js
          node scripts/check-habit-type.js
          node scripts/check-escape.js
          node scripts/check-byyou-lock.js
          node scripts/check-cyrillic-boundary.js
          node scripts/check-tool-filter.js
          node scripts/check-list-detector.js
          node scripts/check-clarify-decision.js
          node scripts/check-llm-boundary.js
          node scripts/check-settings-boundary.js

      # Статичний ловець класу «переніс функцію — забув константи/import»
      # (E2E #39 getFolderColor, B-201 re-export без локального імені).
      # Тільки правило no-undef — конфіг у eslint.config.mjs (26yz5s 03.07).
      - name: Static no-undef (ESLint)
        run: npx eslint src

      - name: Build bundle
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E
        run: npx playwright test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
