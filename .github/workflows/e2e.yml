name: E2E (Playwright)

# Замінює Hetzner-тестер (v1d9eo): безкоштовний раннер у CI. Збирає застосунок
# (esbuild → bundle.js), піднімає статику, ганяє Playwright. Прогон видно в Actions.

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'index.html'
      - 'style.css'
      - 'sw.js'
      - 'src/**'
      - 'build.js'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'   # щодня о 06:00 UTC

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Build bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npx playwright test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
