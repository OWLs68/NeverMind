name: Auto-merge AI-tester branches (docs-only, no build)

# Окремий workflow для гілок claude/ai-tester-* створених AI-тестувальником
# на Hetzner. Тестер пише ТIЛЬКИ у _ai-tools/tester-* файли (його звіт),
# НЕ торкає коду застосунку. Тому НЕ запускаємо npm ci / node build.js /
# check-i18n.js — інакше кирилиця у звітах могла б зламати збірку основного
# деплою (раунд 3 BLOCKER #3 з 15.05.2026 Council).
#
# Якщо тестер чомусь спробує запушити файли поза _ai-tools/ — merge впаде
# (whitelist guard нижче). Це додатковий захист на випадок компромету
# тестерського PAT.

on:
  push:
    branches:
      - 'claude/ai-tester-**'

concurrency:
  group: auto-merge-tester
  cancel-in-progress: true

jobs:
  merge-tester:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify tester pushed only into _ai-tools/
        # Security-аудит vdlyeg (10.06.2026): ref_name через env, не пряму інтерполяцію
        # (назва гілки може містити shell-метасимволи → command injection).
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Тестер має писати ТIЛЬКИ у _ai-tools/. Якщо є інші файли —
          # це або помилка скрипту або компромет токена. Блокуємо merge.
          CHANGED=$(git diff --name-only "origin/main...$REF_NAME")
          BAD=$(echo "$CHANGED" | grep -v '^_ai-tools/' || true)
          if [ -n "$BAD" ]; then
            echo "❌ Тестер спробував змінити файли поза _ai-tools/:"
            echo "$BAD"
            echo "Merge заблоковано."
            exit 1
          fi
          echo "✓ Всі зміни у межах _ai-tools/"

      - name: Verify no PHI/PII (screenshot_b64) leaks into git
        # Security-аудит vdlyeg (10.06.2026): ref_name через env (injection guard).
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Security e9t3N 15.05.2026: тестер ОБОВ'ЯЗКОВО зберігає скрін
          # тільки локально на сервері (screenshot_path). НЕ base64 у JSON.
          # Якщо знайдемо screenshot_b64 з не-null значенням — блокуємо merge.
          # Це захист від компромету тестерського скрипта або помилки Brain-Claude.
          # Без цього guard: скрін health-картки (PHI) міг би потрапити у public repo
          # → GDPR Article 9 порушення → штраф + втрата довіри.
          CHANGED_JSON=$(git diff "origin/main...$REF_NAME" -- '_ai-tools/*.json' '_ai-tools/**/*.json')
          if echo "$CHANGED_JSON" | grep -E '"screenshot_b64"\s*:\s*"[^"]+"' > /dev/null; then
            echo "❌ КРИТИЧНО: тестер записав screenshot_b64 з даними у JSON!"
            echo "PHI/PII у public repo заблоковано."
            echo "Виправ: у Python використовувати screenshot_path (локальний шлях)"
            exit 1
          fi
          echo "✓ Жодних PHI/PII у JSON"

      - name: Merge into main (docs-only, no build)
        # Security-аудит vdlyeg (10.06.2026): ref_name через env (injection guard).
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          # -X theirs: тестерська версія перемагає для своїх же файлів
          # (Романа на NEVERMIND_BUGS / SESSION_STATE тестер не торкає,
          # тому конфлікту не буде)
          git merge --no-edit -X theirs "$REF_NAME"
          git push origin main
          echo "Tester report merged into main"
