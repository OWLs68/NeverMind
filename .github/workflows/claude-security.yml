# Claude Code Security Review — автомат security сканування
# Створено: e9t3N 15.05.2026 Security Council аудит
# Документація: docs/SECURITY.md
# Action repo: https://github.com/anthropics/claude-code-security-review
#
# Anthropic Claude Security (Opus 4.1) сканує код через reasoning замість regex.
# Знаходить уразливості яких статичні сканери пропускають. Self-verification:
# знайдене перевіряється adversarially перш ніж зарепортити.
#
# ВАЖЛИВЕ: action створений для PR-based flow (тригериться на pull_request).
# NeverMind використовує push-based auto-merge без PRs, тому:
# - workflow_dispatch (ручний запуск) — основний спосіб
# - Якщо у майбутньому з'являться PR'и (для тестерів) — автоматичний запуск
#
# Як запустити вручну:
# 1. github.com/OWLs68/NeverMind/actions
# 2. Workflow "Claude Security Review"
# 3. Run workflow → main → Run
# 4. Чекати 2-10 хв (повний сканування codebase)
# 5. Результат у Actions tab + Annotations + artifacts

name: Claude Security Review

permissions:
  pull-requests: write
  contents: read

on:
  # Ручний запуск через GitHub UI
  workflow_dispatch:
  # Якщо PR'и з'являться у майбутньому — автоматично
  pull_request:
    branches:
      - main

jobs:
  security-review:
    runs-on: ubuntu-latest
    # Захист — не запускати на форках без секретів
    if: ${{ github.event_name == 'workflow_dispatch' || github.repository_owner == 'OWLs68' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Check if ANTHROPIC_API_KEY is set
        id: check_key
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "ANTHROPIC_API_KEY не налаштований у Secrets."
            echo "Settings → Secrets → Actions → ANTHROPIC_API_KEY = sk-ant-..."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Claude Code Security Review
        if: steps.check_key.outputs.configured == 'true'
        uses: anthropics/claude-code-security-review@main
        with:
          # Реальні параметри action (перевірені у репо anthropics/claude-code-security-review)
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Коментує у PR з знайденими ризиками (актуально якщо триггер pull_request)
          comment-pr: true
          # Зберігає результати як GitHub Actions artifacts (для перегляду після run)
          upload-results: true
          # Виключаємо bundle.js (generated), node_modules, архіви, бекапи
          exclude-directories: "node_modules,_archive,bundle.js"
          # Модель — найновіший Opus з reasoning
          claude-model: "claude-opus-4-1-20250805"
          # Timeout 20 хв — на повний codebase NeverMind вистачить
          claudecode-timeout: "20"
